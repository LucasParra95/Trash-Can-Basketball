<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
    <title>Trash Can Basketball</title>
	<script type="text/javascript" src="js/phaser.min.js"></script>
	<h2>Basketball de oficina version 0.5.9</h2>
    <style type="text/css">
        body {
            margin: 0;
			font-family: 'Verdana';
			background-color: #d2d2d2;
        }
		canvas {
			margin: 0 auto;
			border: thin solid black;
		}
		span {
			display: block;
			margin: 30px auto;
			width: 500px;
			text-align: center;
		}
		h2 {
			text-align: center;
			font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
			font-size: xxx-large;
			color: antiquewhite;;
			text-shadow: 1px 1px 2px rgb(199, 75, 75), 0 0 2rem rgb(8, 8, 25), 0 0 0.2em blue;
		}
    </style>
</head>
<body>

<script type="text/javascript">

// NOTE: Originally 640x1000. Other possible sizes: 512x800, 400x625
var game = new Phaser.Game(512, 800, Phaser.CANVAS, '', { preload: preload, create: create, update: update });
//alert("La resolucion es de " +screen.width + " x " + screen.height )

function preload() {

    game.load.image('ball', 'assets/images/ball2.png');
    game.load.image('hoop', 'assets/images/Recurso4.png');
	game.load.image('side rim', 'assets/images/side_rim.png');
	game.load.image('front rim', 'assets/images/front_rim.png');
	game.load.image('left wall can', 'assets/images/Recurso 6.png');
	game.load.image('right wall can', 'assets/images/Recurso 8.png');
	game.load.image('bottom can', 'assets/images/Recurso 7.png');
	game.load.image('wind right', 'assets/images/windRight.png');
	game.load.image('wind left', 'assets/images/windLeft.png');


	game.load.image('win0', 'assets/images/win0.png');
	game.load.image('win1', 'assets/images/win1.png');
	game.load.image('win2', 'assets/images/win2.png');
	game.load.image('win3', 'assets/images/win3.png');
	game.load.image('win4', 'assets/images/win4.png');
	game.load.image('lose0', 'assets/images/lose0.png');
	game.load.image('lose1', 'assets/images/lose1.png');
	game.load.image('lose2', 'assets/images/lose2.png');
	game.load.image('lose3', 'assets/images/lose3.png');
	game.load.image('lose4', 'assets/images/lose4.png');

	game.load.audio('score', 'assets/audio/score.wav');
	game.load.audio('backboard', 'assets/audio/backboard.wav');
	game.load.audio('whoosh', 'assets/audio/whoosh.wav');
	game.load.audio('fail', 'assets/audio/fail.wav');
	game.load.audio('spawn', 'assets/audio/spawn.wav');

}

var hoop,
 	left_rim,
	right_rim,
	left_wall_can,
	right_wall_can,
	bottom_can,
	ball,
	front_rim,
	current_score = 0,
	current_score_text,
	streak = 0,
	high_score = 0,
	high_score_text,
	current_best_text,
	wind = 0,
	wind_text,
	wind_direction,
	lifes = 4,
	lifes_text,
	tries = [];

var score_sound,
	backboard,
	whoosh,
	fail,
	spawn;

var moveInTween,
	fadeInTween,
	moveOutTween,
	fadeOutTween,
	emoji,
	emojiName,
	streak_notification;

var collisionGroup;

function loadTries() {
	for (let index = 0; index < lifes; index++) {
		tries[index] = game.add.sprite(90 + 50*index ,70, 'ball');
		tries[index].scale.setTo(0.50, 0.50);
		
	}

console.log(tries);

}

function create() {

	game.physics.startSystem(Phaser.Physics.P2JS);

	game.physics.p2.setImpactEvents(true);

  game.physics.p2.restitution = 0.4;
  game.physics.p2.gravity.y = 0;
  game.physics.p2.gravity.x = 0;

	collisionGroup = game.physics.p2.createCollisionGroup();

	score_sound = game.add.audio('score');
	backboard = game.add.audio('backboard');
	backboard.volume = 0.5;
	whoosh = game.add.audio('whoosh');
	fail = game.add.audio('fail');
	fail.volume = 0.1;
	spawn = game.add.audio('spawn');

	game.stage.backgroundColor = "#ffffff";

	hoop = game.add.sprite(206, 175, 'hoop'); // 141, 100
	left_rim = game.add.sprite(206, 184, 'side rim'); // 241, 296
	right_rim = game.add.sprite(300, 184, 'side rim'); // 398, 296
	left_wall_can = game.add.sprite(210,240, 'left wall can')
	right_wall_can = game.add.sprite(295,240, 'right wall can')
	bottom_can = game.add.sprite(253,308, 'bottom can')
	bottom_can.scale.setTo(0.500, 1);

	loadTries();	
console.log(game.add);

	game.physics.p2.enable([ left_rim, right_rim, left_wall_can, right_wall_can, bottom_can], false);

	left_rim.body.setCircle(1);
	left_rim.body.static = true;
	left_rim.body.setCollisionGroup(collisionGroup);
	left_rim.body.collides([collisionGroup]);

	right_rim.body.setCircle(1);
	right_rim.body.static = true;
	right_rim.body.setCollisionGroup(collisionGroup);
	right_rim.body.collides([collisionGroup]);

	left_wall_can.body.static = true;
	left_wall_can.body.setCollisionGroup(collisionGroup);
	left_wall_can.body.collides([collisionGroup]);
	right_wall_can.body.static = true;
	right_wall_can.body.setCollisionGroup(collisionGroup);
	right_wall_can.body.collides([collisionGroup]);
	bottom_can.body.static = true;
	bottom_can.body.setCollisionGroup(collisionGroup);
	bottom_can.body.collides([collisionGroup]);

	// high_score_text = game.add.text(450, 25, 'High Score\n' + high_score, { font: 'Arial', fontSize: '32px', fill: '#000', align: 'center' });
	current_score_text = game.add.text(244, 351, '', { font: 'Verdana', fontSize: '40px', fill: '#000', align: 'center' }); // 300, 500
	current_best_text = game.add.text(200, 320, '', { font: 'Arial', fontSize: '20px', fill: '#000', align: 'center' });// 230, 450
	current_best_score_text = game.add.text(244, 351, '', { font: 'Verdana', fontSize: '40px', fill: '#00e6e6', align: 'center' }); // 300, 500
	wind_text = game.add.text(240, 750, 'No hay viento', { font: 'Verdana', fontSize: '25px', fill: '#000', align: 'right' })
	lifes_text = game.add.text(75, 55, "Intentos restantes: " + lifes, { font: 'Verdana', fontSize: '20px', fill: '#000', align: 'center' }); // 300, 500
	streak_notification = game.add.text(145, 400, '', { font: 'Impact', fontSize: '40px', fill: '#901238', align: 'center' });

	createBall();

	cursors = game.input.keyboard.createCursorKeys();

	game.input.onDown.add(click, this);
	game.input.onUp.add(release, this);


	var instructions = document.createElement("span");
	instructions.innerHTML = "Instructions: Quickly drag the paper ball to shoot it into the trash can!";
	document.body.appendChild(instructions);

	var firma = document.createElement("h2");
	firma.innerHTML = "Developed by Lucas Parra";
	document.body.appendChild(firma);

}

function update() {

	if (ball && ball.body.velocity.y > 0) {
		// front_rim = game.add.sprite(206, 182, 'front rim');
		ball.body.collides([collisionGroup], hitRim, this);
	}

	if (ball && ball.body.velocity.y > 0 && ball.body.y > 188 && !ball.isBelowHoop) {
		ball.isBelowHoop = true;
		ball.body.collideWorldBounds = false;
		var rand = Math.floor(Math.random() * 5);
		if (ball.body.x > 206 && ball.body.x < 306) {
			emojiName = "win" + rand;
			current_score += 1;
			streak +=1
			current_score_text.text = current_score;
			score_sound.play();
			if (streak === 1) {
				lifes+=1;
				lifes_text.text = "Intentos restantes: " + lifes;
				//Extra life notification
				streak_notification.text = 'Intento extra!';
				setTimeout(function(){
					streak_notification.text = '';
				},2000)

				tries[lifes-1] = game.add.sprite(90 + 50*(lifes -1),70, 'ball');
				tries[lifes-1].scale.setTo(0.50, 0.50);
				streak = 0;

			}
			setTimeout(function(){
				game.physics.p2.gravity.y = 0;
				game.physics.p2.gravity.x = 0;
				ball.kill();
				createBall();
			},1000);

			//////////////
			wind_direction ? wind_direction.kill() : null;
			if((Math.random() < 0.5 ? -1 : 1)>0){
				wind_direction = game.add.sprite(300,680, 'wind right');

				wind = current_score * 200;
			}else{
				wind_direction = game.add.sprite(300,680, 'wind left');
	
				wind = -1 * current_score * 200;

			}
			wind_direction.scale.setTo(0.50, 0.50);
			wind_text.text = 'El viento es de ' +  (current_score * 2)  + ' k/h';

		} else {
			emojiName = "lose" + rand;
			streak = 0;
			fail.play();
			if (lifes) {
				lifes -= 1;
				console.log(tries);
				game.add.tween(tries[lifes]).to( { alpha: 0 }, 300, Phaser.Easing.Linear.None, true, 0, 0, false);
				tries.pop()

			}else{
				if (current_score > high_score) {
				high_score = current_score;
				}
				current_score = 0;
				current_score_text.text = '';
				current_best_text.text = 'Record Actual';
				current_best_score_text.text = high_score;
				wind = 0;
				wind_text.text = 'No hay viento';
				lifes = 4;
				alert("Perdiste!!");
				wind_direction.kill();
				loadTries();
			}

			lifes_text.text = "Intentos restantes: " + lifes;
		}
		
		emoji = game.add.sprite(210, 70, emojiName);
		emoji.scale.setTo(0.50, 0.50);
		moveInTween = game.add.tween(emoji).from( { y: 150 }, 500, Phaser.Easing.Elastic.Out, true);
		fadeInTween = game.add.tween(emoji).from( { alpha: 0 }, 200, Phaser.Easing.Linear.None, true, 0, 0, false);
		moveInTween.onComplete.add(tweenOut, this);

	}

	if (ball && ball.body.y > 1200) {
		game.physics.p2.gravity.y = 0;
		game.physics.p2.gravity.x = 0;
		ball.kill();
		createBall();
	}

}

function tweenOut() {
	moveOutTween = game.add.tween(emoji).to( { y: 50 }, 600, Phaser.Easing.Elastic.In, true);
	moveOutTween.onComplete.add(function() { emoji.kill(); }, this);
	setTimeout(function () {
		fadeOutTween = game.add.tween(emoji).to( { alpha: 0 }, 300, Phaser.Easing.Linear.None, true, 0, 0, false);
	}, 450);
}

function hitRim() {

	backboard.play();

}

function createBall() {

	var xpos;
	if (current_score < 5) {
		xpos = 256;
	} else {
		xpos = 60 + Math.random() * 280;
	}
	spawn.play();
	ball = game.add.sprite(xpos,600, 'ball');
	game.add.tween(ball.scale).from({x : 0.7, y : 0.7}, 300, Phaser.Easing.Linear.None, true, 0, 0, false);
	game.physics.p2.enable(ball, false);
	ball.body.setCircle(40); // NOTE: Goes from 60 to 36
	ball.launched = false;
	ball.isBelowHoop = false;

}

var location_interval;
var isDown = false;
var start_location;
var end_location;

function click(pointer) {

	var bodies = game.physics.p2.hitTest(pointer.position, [ ball.body ]);
	if (bodies.length) {
		start_location = [pointer.x, pointer.y];
		isDown = true;
		location_interval = setInterval(function () {
			start_location = [pointer.x, pointer.y];
		}.bind(this), 100);
	}

}

function release(pointer) {

	if (isDown) {
		window.clearInterval(location_interval);
		isDown = false;
		end_location = [pointer.x, pointer.y];

		if (end_location[1] < start_location[1]) {
			var slope = [end_location[0] - start_location[0], end_location[1] - start_location[1]];
			var x_traj = -800 * slope[0] / slope[1];
			launch(x_traj);
		}
	}

}

function launch(x_traj) {

	if (ball.launched === false) {
		ball.body.setCircle(20);
		ball.body.setCollisionGroup(collisionGroup);
		current_best_text.text = '';
		current_best_score_text.text = '';
		ball.launched = true;
		game.physics.p2.gravity.y = 3000;

		game.physics.p2.gravity.x = wind;

		game.add.tween(ball.scale).to({x : 0.4, y : 0.4}, 50, Phaser.Easing.Linear.None, true, 0, 0, false);
		ball.body.velocity.x = x_traj;
		ball.body.velocity.y = -1750;
		ball.body.rotateRight(x_traj / 3);
		whoosh.play();
	}

}

</script>

</body>
</html>
